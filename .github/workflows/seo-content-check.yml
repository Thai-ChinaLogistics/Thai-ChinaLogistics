name: SEO content safety check

on:
  pull_request:
    paths:
      - '**/*.html'
      - '.github/workflows/seo-content-check.yml'
      - 'scripts/check_seo_static_metadata.py'
      - 'scripts/submit_indexnow.py'
      - 'tests/test_indexnow_submission.py'
      - 'scripts/check_visible_internal_tokens.py'
      - 'scripts/baidu_verification.py'
      - 'tests/test_baidu_verification.py'
      - 'tests/test_visible_internal_tokens.py'
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - '.github/workflows/seo-content-check.yml'
      - 'scripts/check_seo_static_metadata.py'
      - 'scripts/submit_indexnow.py'
      - 'tests/test_indexnow_submission.py'
      - 'scripts/check_visible_internal_tokens.py'
      - 'scripts/baidu_verification.py'
      - 'tests/test_baidu_verification.py'
      - 'tests/test_visible_internal_tokens.py'

jobs:
  check-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify static metadata matches existing default-language page copy
        run: python scripts/check_seo_static_metadata.py
      - name: Verify all public pages exclude visible internal workflow markers
        run: |
          python -m unittest tests.test_visible_internal_tokens -v
          python scripts/check_visible_internal_tokens.py
      - name: Validate optional Baidu ownership tag without claiming platform verification
        run: |
          python -m unittest tests.test_baidu_verification -v
          python scripts/baidu_verification.py --root .

      - name: Verify page metadata and no internal tokens
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import sys

          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.title = False
                  self.description = False
                  self.h1 = False
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'title': self.title = True
                  if tag == 'h1': self.h1 = True
                  if tag == 'meta' and attrs.get('name', '').lower() == 'description' and attrs.get('content', '').strip():
                      self.description = True

          pages = [Path('china-to-thailand.html'), Path('thailand-to-china-express.html')]
          failures = []
          for path in pages:
              html = path.read_text(encoding='utf-8')
              parser = Page()
              parser.feed(html)
              for key in ('title', 'description', 'h1'):
                  if not getattr(parser, key): failures.append(f'{path}: missing {key}')
              for token in ('SEARCH_INTENT_ONLY', 'COMMERCIAL_IMPORT'):
                  if token in html: failures.append(f'{path}: internal token {token}')
          if failures:
              print('\n'.join(failures))
              sys.exit(1)
          print('PASS: checked 2 target pages, metadata and internal tokens')
          PY

      - name: Validate IndexNow URL scoping and send only changed public URLs
        if: github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Never submit unchanged pages, unapproved URLs or PR-branch content.
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            : > indexnow-changed-files.txt
          else
            git diff --name-only --diff-filter=AM "$BEFORE" "$AFTER" -- '*.html' > indexnow-changed-files.txt
          fi
          python -m unittest tests.test_indexnow_submission -v
          python scripts/submit_indexnow.py \
            --root . \
            --changed-files indexnow-changed-files.txt \
            --report indexnow-receipt.json

      - name: Archive IndexNow receipt (not evidence of indexing)
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-receipt-${{ github.run_number }}
          path: indexnow-receipt.json
          if-no-files-found: ignore
          retention-days: 30
