name: SEO service landing page responsive preview
on:
  pull_request:
    paths:
      - 'thailand-to-china-express.html'
      - 'thailand-to-china-pickup.html'
      - 'index.html'
      - 'seo-pages.css'
      - '.github/workflows/seo-express-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Confirm source copy and links
        shell: bash
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]
              def handle_starttag(self, tag, attrs):
                  if tag=="a": self.links.append(dict(attrs).get("href", ""))
          raw=Path("thailand-to-china-express.html").read_text(encoding="utf-8")
          page=Page(); page.feed(raw)
          assert '<strong>直接回答：</strong>' in raw
          assert raw.count("<ol>")==2
          assert "https://wa.me/66839769828" in page.links
          assert 'href="seo-pages.css"' in raw
          pickup=Path("thailand-to-china-pickup.html").read_text(encoding="utf-8")
          pickup_page=Page(); pickup_page.feed(pickup)
          assert '<strong>直接回答：</strong>' in pickup
          assert pickup.count("<ol>") >= 1
          assert "https://wa.me/66839769828" in pickup_page.links
          assert 'href="seo-pages.css"' in pickup
          print("PASS: express and pickup answers, lists, WhatsApp CTA and styles")
          PY
      - name: Install CJK and Thai screenshot fonts
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk fonts-thai-tlwg
          fc-cache -f >/dev/null
          fc-list :lang=zh family | head -n 3
      - name: Capture source-level responsive screenshots
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$BROWSER" ]; then
            echo "No headless Chromium/Chrome on runner"
            exit 1
          fi
          mkdir -p preview
          URL="file://${GITHUB_WORKSPACE}/thailand-to-china-express.html"
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot=preview/express-mobile-390.png "$URL" >/tmp/chrome-mobile.log 2>&1
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,900 --screenshot=preview/express-desktop-1440.png "$URL" >/tmp/chrome-desktop.log 2>&1
          PICKUP_URL="file://${GITHUB_WORKSPACE}/thailand-to-china-pickup.html"
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=2500 --window-size=390,844 --screenshot=preview/pickup-mobile-390.png "$PICKUP_URL" >/tmp/chrome-pickup-mobile.log 2>&1
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=2500 --window-size=1440,900 --screenshot=preview/pickup-desktop-1440.png "$PICKUP_URL" >/tmp/chrome-pickup-desktop.log 2>&1
          HOME_URL="file://${GITHUB_WORKSPACE}/index.html"
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3000 --window-size=390,844 --screenshot=preview/home-mobile-390.png "$HOME_URL" >/tmp/chrome-home-mobile.log 2>&1
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3000 --window-size=1440,900 --screenshot=preview/home-desktop-1440.png "$HOME_URL" >/tmp/chrome-home-desktop.log 2>&1
          "$BROWSER" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=3000 --window-size=390,844 --screenshot=preview/home-reviews-mobile-390.png "${HOME_URL}#reviews" >/tmp/chrome-home-reviews.log 2>&1
          test "$(stat -c %s preview/home-mobile-390.png)" -gt 1000
          test "$(stat -c %s preview/home-desktop-1440.png)" -gt 1000
          test "$(stat -c %s preview/home-reviews-mobile-390.png)" -gt 1000
          test "$(stat -c %s preview/pickup-mobile-390.png)" -gt 1000
          test "$(stat -c %s preview/pickup-desktop-1440.png)" -gt 1000
          test "$(stat -c %s preview/express-mobile-390.png)" -gt 1000
          test "$(stat -c %s preview/express-desktop-1440.png)" -gt 1000
          file preview/*.png
      - name: Upload visual review evidence
        uses: actions/upload-artifact@v4
        with:
          name: seo-landing-pages-responsive-preview
          path: preview/*.png
          retention-days: 14
