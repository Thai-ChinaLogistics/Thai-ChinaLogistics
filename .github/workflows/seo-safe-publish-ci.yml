name: SEO自动发布安全门禁

on:
  pull_request:
    paths:
      - '*.html'
      - 'tools/seo_publish_guard.py'
      - 'tests/test_seo_publish_guard.py'
      - '.github/workflows/seo-safe-publish-ci.yml'
      - 'sitemap.xml'
      - 'ai-entity.json'
      - 'llms.txt'
      - 'tools/audit_geo_service_claims.py'
      - 'tests/test_geo_service_claims.py'
      - 'tools/audit_sitemap_pages.py'
      - 'tests/test_sitemap_pages.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-safe-publish-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run guard unit tests
        run: python -m unittest tests/test_seo_publish_guard.py -v

      - name: Run public GEO entity / business-claims audit tests
        run: python -m unittest tests/test_geo_service_claims.py -v

      - name: Collect read-only SEO/GEO service-fact review report
        run: python tools/audit_geo_service_claims.py --site-root . --output "${{ runner.temp }}/geo-service-claims.json"

      - name: Preserve GEO fact review evidence
        uses: actions/upload-artifact@v4
        with:
          name: seo-geo-service-fact-audit
          path: ${{ runner.temp }}/geo-service-claims.json
          retention-days: 14

      - name: Run full sitemap technical audit tests
        run: python -m unittest tests/test_sitemap_pages.py -v

      - name: Audit all sitemap HTML, canonical, index directives and JSON-LD
        run: python tools/audit_sitemap_pages.py --root . --output "${{ runner.temp }}/sitemap-page-audit.json"

      - name: Preserve all-page SEO technical evidence
        uses: actions/upload-artifact@v4
        with:
          name: seo-sitemap-page-audit
          path: ${{ runner.temp }}/sitemap-page-audit.json
          retention-days: 14

      - name: Validate SEO auto-publish diff
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'seo-auto/') || github.head_ref == 'feat/seo-safe-auto-publish')
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          EXTRA=""
          if [ "${{ github.head_ref }}" = "feat/seo-safe-auto-publish" ]; then
            EXTRA="--allow-infrastructure"
          fi
          python tools/seo_publish_guard.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --head-ref HEAD \
            $EXTRA

      - name: Manual feature branch note
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'seo-auto/') && github.head_ref != 'feat/seo-safe-auto-publish'
        run: |
          echo "Manual/user-approved feature PR: SEO auto single-page diff guard is not applicable; unit tests still run."
