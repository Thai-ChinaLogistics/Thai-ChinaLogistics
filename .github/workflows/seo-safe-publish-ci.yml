name: SEO自动发布安全门禁

on:
  pull_request:
    paths:
      - '*.html'
      - 'tools/seo_publish_guard.py'
      - 'tests/*.py'
      - '.github/workflows/seo-safe-publish-ci.yml'
      - 'sitemap.xml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seo-safe-publish-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run SEO repository tests
        run: python -m unittest discover -s tests -v

      - name: Validate SEO auto-publish diff
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'seo-auto/') || github.head_ref == 'feat/seo-safe-auto-publish')
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          EXTRA=""
          if [ "${{ github.head_ref }}" = "feat/seo-safe-auto-publish" ]; then
            EXTRA="--allow-infrastructure"
          fi
          python tools/seo_publish_guard.py \
            --base-ref "origin/${{ github.base_ref }}" \
            --head-ref HEAD \
            $EXTRA

      - name: Manual feature branch note
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'seo-auto/') && github.head_ref != 'feat/seo-safe-auto-publish'
        run: echo "Manual/user-approved feature PR: SEO auto single-page diff guard is not applicable; repository tests still run."
